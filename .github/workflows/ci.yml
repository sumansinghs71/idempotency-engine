# =============================================================================
# CI — build and full test suite
# =============================================================================
# ubuntu-latest runners ship a working Docker daemon, which is what the suite
# needs: every integration test extends AbstractPostgresIT and starts a real
# postgres:15-alpine through Testcontainers. There is no service container here
# on purpose — Testcontainers owns the database lifecycle, and a second Postgres
# on 5432 would only be a decoy.
# =============================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Confirm Docker is available to Testcontainers
        run: docker version

      - name: Build and run the full test suite
        run: ./gradlew --no-daemon --console=plain clean build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn
