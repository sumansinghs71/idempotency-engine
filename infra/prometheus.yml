# =============================================================================
# Prometheus scrape config for IdemEngine.
# Scrapes the Spring Boot Actuator /actuator/prometheus endpoint every 5s.
# =============================================================================
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'idem-engine'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # host.docker.internal works on Docker Desktop (Mac/Windows).
      # On Linux: change to your host IP, or add --network=host to the
      # prometheus service and use 'localhost:8080'.
      - targets: ['host.docker.internal:8080']
        labels:
          app: 'idem-engine'
          env: 'local'
