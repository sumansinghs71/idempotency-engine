# =============================================================================
# IdemEngine — application configuration
# =============================================================================
spring:
  application:
    name: idem-engine
  datasource:
    url: jdbc:postgresql://localhost:5432/vector_store_idem
    username: ${PG_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000
  jpa:
    hibernate:
      # Set to 'none' — let Flyway manage the schema entirely via migrations (V1__schema.sql).
      # This prevents Hibernate from running validation/DDL before Flyway has a chance to run.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        # Disable JTA platform warning (we use JDBC transactions, not JTA)
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Always try to create the schema if it doesn't exist
    create-schemas: true
    # Automatically baseline an existing non-empty schema if no schema history table exists
    baseline-on-migrate: true
    # Baseline version to apply when baselining; adjust if your first migration has a different version
    baseline-version: 1
    # Clean database on startup (WARNING: destructive — only for dev; remove for production!)
    clean-disabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # Publish Prometheus histogram buckets for our two Timers so the
      # Grafana dashboard can compute p95/p99 via histogram_quantile().
      percentiles-histogram:
        idem.external_call.duration: true
        idem.lock_wait.duration: true
        http.server.requests: true
      # Override the default SLO buckets to ones meaningful for our latencies.
      slo:
        idem.external_call.duration: 10ms,50ms,100ms,250ms,500ms,1s,5s
        idem.lock_wait.duration: 1ms,5ms,10ms,25ms,100ms,500ms,2s

logging:
  level:
    root: INFO
    com.yourname.idempotency: DEBUG
    org.hibernate.SQL: WARN
    org.flywaydb: DEBUG

# Application-specific tuning. See TRD §2.4 (TTL) and §2.5 (lock staleness).
idempotency:
  ttl: PT24H               # 24 hours, ISO-8601 duration
  lock-staleness: PT90S    # 90 seconds — must exceed PSP timeout
  max-key-length: 100

psp:
  base-url: http://localhost:9999   # fake PSP in tests
  timeout-ms: 80000                 # matches Stripe SDK default

