# =============================================================================
# IdemEngine — local dev infrastructure
# =============================================================================
# Postgres 15 + Toxiproxy + Prometheus + Grafana.
# The quickstart needs `postgres` alone; the other three are the optional
# observability stack.
# Bring up:  docker compose up -d postgres   (or `docker compose up -d` for all)
# Tear down: docker compose down -v
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: idem-postgres
    environment:
      # Defaults match the defaults in src/main/resources/application.yml, so a
      # bare `docker compose up -d` produces exactly the database the app expects.
      POSTGRES_DB: ${POSTGRES_DB:-idempotency}
      POSTGRES_USER: ${POSTGRES_USER:-idem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idem}
    ports:
      # Published on 5433, not 5432, deliberately: 5432 is very often already
      # taken by a natively-installed Postgres, and when it is, the app connects
      # to that server instead and fails with `FATAL: role "idem" does not
      # exist`. Publishing on a non-default port removes the ambiguity entirely.
      # application.yml's default DB_URL points at 5433 to match. Override both
      # with POSTGRES_PORT and DB_URL if 5433 is taken too.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - idem-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idem} -d ${POSTGRES_DB:-idempotency}"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Toxiproxy sits between the app and a fake PSP so chaos tests can
  # inject network failures (timeouts, resets, latency).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: idem-toxiproxy
    ports:
      - "8474:8474"  # admin
      - "8666:8666"  # the proxied PSP port
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy.json:/config/toxiproxy.json:ro

  # Prometheus scrapes /actuator/prometheus on the host every 5s.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: idem-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets the container resolve host.docker.internal on Linux too.
      - "host.docker.internal:host-gateway"

  # Grafana with the IdemEngine dashboard auto-provisioned. http://localhost:3000 (admin/admin).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: idem-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  idem-pgdata:
