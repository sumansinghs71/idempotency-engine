# =============================================================================
# IdemEngine — application configuration
# =============================================================================
spring:
  application:
    name: idem-engine
  datasource:
    # Defaults match docker-compose.yml exactly, so `docker compose up -d postgres`
    # followed by `./gradlew bootRun` works with no environment set at all.
    # Host port 5433, not 5432: the container publishes on a non-default port on
    # purpose, so a natively installed Postgres already holding 5432 can never be
    # mistaken for the container. Override any of the three for a real deployment.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/idempotency}
    username: ${DB_USERNAME:idem}
    password: ${DB_PASSWORD:idem}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000
  jpa:
    hibernate:
      # 'validate', not 'none'. Flyway owns the schema (V1__schema.sql); Hibernate
      # never issues DDL. But it does verify at startup that every entity mapping
      # matches the migrated schema, so a column-type drift fails fast at boot
      # instead of silently at query time. Flyway's Spring Boot integration runs
      # before the EntityManagerFactory is initialised, so the tables exist by then.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        # Disable JTA platform warning (we use JDBC transactions, not JTA)
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
  flyway:
    enabled: true
    # Versioned migrations only by default. The `dev` profile document at the
    # bottom of this file appends classpath:db/seed, which holds the
    # afterMigrate callback that inserts the demo fixtures. Seeding is a Flyway
    # callback and nothing else, so there is no second seeding path that can
    # fall out of step with the schema.
    locations: classpath:db/migration
    # Always try to create the schema if it doesn't exist
    create-schemas: true
    # Automatically baseline an existing non-empty schema if no schema history table exists
    baseline-on-migrate: true
    # Baseline version to apply when baselining; adjust if your first migration has a different version
    baseline-version: 1
    # flyway.clean() drops every object in the schema. Disabled by default so it
    # can never be triggered accidentally or by a misconfigured deployment.
    clean-disabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # Publish Prometheus histogram buckets for our two Timers so the
      # Grafana dashboard can compute p95/p99 via histogram_quantile().
      percentiles-histogram:
        idem.external_call.duration: true
        idem.lock_wait.duration: true
        http.server.requests: true
      # Override the default SLO buckets to ones meaningful for our latencies.
      slo:
        idem.external_call.duration: 10ms,50ms,100ms,250ms,500ms,1s,5s
        idem.lock_wait.duration: 1ms,5ms,10ms,25ms,100ms,500ms,2s

logging:
  level:
    root: INFO
    io.github.sumansinghs71.idempotency: DEBUG
    org.hibernate.SQL: WARN
    org.flywaydb: DEBUG

# Application-specific tuning. See TRD §2.4 (TTL) and §2.5 (lock staleness).
idempotency:
  ttl: PT24H               # 24 hours, ISO-8601 duration
  lock-staleness: PT90S    # 90 seconds — must exceed PSP timeout
  max-key-length: 100

psp:
  base-url: http://localhost:9999   # fake PSP in tests
  timeout-ms: 80000                 # matches Stripe SDK default

---
# =============================================================================
# dev profile — local quickstart only
# =============================================================================
# Adds the seed location to Flyway. The file it picks up is
# db/seed/afterMigrate__seed_dev_fixtures.sql, a callback Flyway runs at the end
# of migrate(), which is what makes the fresh-database order correct by
# construction: schema first, fixtures second, application context afterwards.
# `./gradlew bootRun` activates this profile by default (see build.gradle.kts).
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
